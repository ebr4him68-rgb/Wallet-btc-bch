<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallet BTC BCH</title>

<style>

body{
margin:0;
font-family:tahoma,Arial;
background:#080808;
color:white;
text-align:center;
}

.top{
display:flex;
justify-content:space-between;
padding:15px;
font-size:28px;
}

.container{
max-width:450px;
margin:auto;
padding:10px;
}

.card{
background:#171717;
border-radius:25px;
padding:20px;
margin:15px 0;
box-shadow:0 0 15px #333;
}

.logo{
font-size:45px;
}

.coin-logo{
font-size:30px;
}

.dot{
display:inline-block;
width:12px;
height:12px;
border-radius:50%;
background:#00ff66;
animation:blink 1s infinite;
}

@keyframes blink{
50%{
opacity:.2;
}
}

input{
width:85%;
padding:14px;
margin:8px;
border-radius:12px;
border:0;
font-size:16px;
}

button{
background:#f5b700;
border:0;
padding:13px 25px;
border-radius:15px;
font-size:16px;
cursor:pointer;
}


#wallet{
display:none;
}


#settings{
display:none;
position:absolute;
right:15px;
top:60px;
background:#222;
padding:15px;
border-radius:15px;
}


#settings button{
display:block;
margin:10px;
width:150px;
}


</style>

</head>


<body>


<div class="top">

<div onclick="showMessages()">
✉️
</div>


<div onclick="showSettings()">
⚙️
</div>

</div>



<div class="container">


<div class="logo">

🟠₿ 🟢

</div>


<h1>
Wallet BTC BCH
</h1>



<div class="card">


<h3>قیمت آنلاین</h3>


<div>

<span class="coin-logo">🟠</span>

Bitcoin

<span class="dot"></span>

<p id="btcPrice">
Loading...
</p>

</div>



<div>

<span class="coin-logo">🟢</span>

Bitcoin Cash

<span class="dot"></span>

<p id="bchPrice">
Loading...
</p>

</div>


</div>



<div id="login" class="card">


<h2>
ورود به کیف
</h2>


<input id="email" placeholder="ایمیل">


<input id="password" type="password" placeholder="رمز ورود">


<br>


<button onclick="login()">
ورود / ثبت نام
</button>


</div>



<div id="wallet">


<div class="card">

<h2>
🔐 Wallet
</h2>


<p id="userEmail"></p>


<h1>
0.00 USD
</h1>


<p>
موجودی کل
</p>


</div>


</div><!-- پنل دریافت و ارسال -->

<div class="card">

<h2>📥 دریافت BTC</h2>

<p>آدرس بیت کوین:</p>

<input id="btcAddress"
value="1Q99GpYnEU9yELNLjiJUWopNT1HatRYQrV"
readonly>

<button onclick="copyBTC()">
کپی آدرس BTC
</button>


<hr>


<h2>📥 دریافت BCH</h2>

<p>آدرس بیت کوین کش:</p>

<input id="bchAddress"
value="bitcoincash:qrj64uh0xlah2wzksudq3g5eeg2ewdyg6urq5kywku"
readonly>


<button onclick="copyBCH()">
کپی آدرس BCH
</button>


</div>



<div class="card">


<h2>📤 ارسال ارز</h2>


<select id="sendCoin">

<option value="btc">
Bitcoin BTC
</option>


<option value="bch">
Bitcoin Cash BCH
</option>


</select>


<br><br>


<input id="sendAmount"
placeholder="مقدار ارز">


<p id="usdValue">
ارزش تقریبی: 0.00 USD
</p>



<button onclick="sendRequest()">

ثبت ارسال

</button>


</div>



<div class="card">


<h2>
✉️ پیام تراکنش‌ها
</h2>


<p id="messages">

هنوز تراکنشی ثبت نشده

</p>


  </div>
  <script>

let BTC_PRICE = 0;
let BCH_PRICE = 0;



// ورود / ثبت نام

function login(){

let email =
document.getElementById("email").value;

let pass =
document.getElementById("password").value;


if(email=="" || pass==""){

alert("ایمیل و رمز را وارد کنید");
return;

}


localStorage.setItem("walletEmail",email);
localStorage.setItem("walletPass",pass);



document.getElementById("login").style.display="none";

document.getElementById("wallet").style.display="block";


document.getElementById("userEmail").innerHTML=
"کاربر: "+email;


}




// قیمت آنلاین BTC و BCH

async function getPrices(){

try{


let res = await fetch(
"https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,bitcoin-cash&vs_currencies=usd"
);


let data = await res.json();



BTC_PRICE =
data.bitcoin.usd;


BCH_PRICE =
data["bitcoin-cash"].usd;



document.getElementById("btcPrice").innerHTML =
BTC_PRICE.toFixed(2)+" USD";



document.getElementById("bchPrice").innerHTML =
BCH_PRICE.toFixed(2)+" USD";



}

catch(e){

}

}


getPrices();

setInterval(getPrices,60000);





// کپی آدرس BTC

function copyBTC(){

navigator.clipboard.writeText(
document.getElementById("btcAddress").value
);


alert("آدرس BTC کپی شد");

}




// کپی آدرس BCH

function copyBCH(){

navigator.clipboard.writeText(
document.getElementById("bchAddress").value
);


alert("آدرس BCH کپی شد");

}





// محاسبه دلار هنگام ارسال

document.getElementById("sendAmount").oninput=function(){


let amount =
Number(this.value);


let coin =
document.getElementById("sendCoin").value;



let value=0;



if(coin=="btc"){

value=amount*BTC_PRICE;

}


if(coin=="bch"){

value=amount*BCH_PRICE;

}



document.getElementById("usdValue").innerHTML=

"ارزش تقریبی: "+
value.toFixed(2)
+" USD";


}





// ثبت درخواست ارسال

function sendRequest(){


let coin =
document.getElementById("sendCoin").value;


let amount =
document.getElementById("sendAmount").value;



document.getElementById("messages").innerHTML=

"درخواست ارسال ثبت شد: "
+
amount+" "
+
coin.toUpperCase();



alert("تراکنش ثبت شد");


}





// تنظیمات

function showSettings(){

alert(
"تنظیمات\nایمیل کاربر\nتغییر رمز\nAdmin\nخروج"
);

}




function showMessages(){

alert(
"پیام‌ها و تراکنش‌ها"
);

}



  </script>
