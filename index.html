<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Wallet BTC BCH</title>

<style>

body{
margin:0;
font-family:tahoma;
background:#ffd900;
color:#111;
}

.app{
max-width:450px;
margin:auto;
padding:15px;
text-align:center;
}

.card{
background:white;
padding:20px;
margin:15px 0;
border-radius:25px;
box-shadow:0 5px 20px #b99b00;
}

.logo{
font-size:45px;
}

input,select{
width:90%;
padding:13px;
margin:8px;
border-radius:12px;
border:1px solid #ccc;
}

button{
padding:12px 25px;
border:0;
border-radius:15px;
background:#111;
color:white;
}

.price{
background:#111;
color:white;
border-radius:15px;
padding:10px;
margin:10px;
}

.dot{
display:inline-block;
width:12px;
height:12px;
background:#00ff55;
border-radius:50%;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:.2}
}

#wallet{
display:none;
}

.address{
background:#eee;
padding:10px;
border-radius:10px;
font-size:12px;
word-break:break-all;
}

.menu{
display:none;
position:absolute;
top:60px;
right:20px;
background:white;
padding:15px;
border-radius:15px;
}

</style>

</head>


<body>


<div class="app">


<div style="display:flex;justify-content:space-between;font-size:25px">

<span onclick="messages()">✉️</span>

<span onclick="settings()">⚙️</span>

</div>



<div class="logo">
🟠₿ 🟢
</div>


<h1>
Wallet BTC BCH
</h1>



<div class="card">


<h3>قیمت آنلاین</h3>


<div class="price">
🟠 Bitcoin
<span class="dot"></span>
<br>
<span id="btcPrice">...</span>
</div>


<div class="price">
🟢 Bitcoin Cash
<span class="dot"></span>
<br>
<span id="bchPrice">...</span>
</div>


</div>



<div id="login" class="card">


<h2>
ورود به کیف
</h2>


<input id="username" placeholder="نام کاربری / ایمیل">


<input id="password" type="password" placeholder="رمز">


<button onclick="login()">
ورود
</button>


</div>





<div id="wallet">


<div class="card">

<h2>
کیف کاربر
</h2>


<p id="userName"></p>


<h1 id="totalUSD">
0.00 USD
</h1>


<p>
موجودی کل
</p>


</div>





<div class="card">


<h2>📥 دریافت BTC</h2>


<div class="address">
1Q99GpYnEU9yELNLjiJUWopNT1HatRYQrV
</div>


<button onclick="copyBTC()">
کپی BTC
</button>



<hr>



<h2>📥 دریافت BCH</h2>


<div class="address">
bitcoincash:qrj64uh0xlah2wzksudq3g5eeg2ewdyg6urq5kywku
</div>


<button onclick="copyBCH()">
کپی BCH
</button>


</div>







<div class="card">

<h2>
📤 ارسال
</h2>


<select id="currency">

<option value="btc">
Bitcoin
</option>

<option value="bch">
Bitcoin Cash
</option>

</select>



<input id="amount" placeholder="مقدار">


<p id="convert">
0.00 USD
</p>


<button onclick="send()">
ثبت ارسال
</button>


</div>



</div>



</div>




<div id="menu" class="menu">

<p id="menuUser"></p>

<button onclick="changePass()">
تغییر رمز
</button>


<button onclick="admin()">
Admin
</button>


<button onclick="logout()">
خروج
</button>


</div>





<script>


let BTC=0;
let BCH=0;



function login(){

let u=username.value;

let p=password.value;


if(!u || !p){

alert("اطلاعات را وارد کنید");
return;

}


localStorage.setItem("user",u);

localStorage.setItem("pass",p);


openWallet();

}




function openWallet(){

let u=localStorage.getItem("user");


if(u){

login.style.display="none";

wallet.style.display="block";


userName.innerHTML=
"کاربر: "+u;


}

}




window.onload=function(){

openWallet();

}





function settings(){

menu.style.display=
menu.style.display=="block"
?"none":"block";


menuUser.innerHTML=
localStorage.getItem("user")||"";

}




function logout(){

localStorage.removeItem("user");

location.reload();

}





function changePass(){

let p=prompt("رمز جدید");


if(p){

localStorage.setItem("pass",p);

alert("رمز تغییر کرد");

}

}




function admin(){

let p=prompt("رمز مدیر");


if(p=="Admin321"){

alert("ورود مدیر");

}

else{

alert("رمز اشتباه");

}

}





function messages(){

alert("پیام تراکنش‌ها");

}




async function price(){

try{


let r=await fetch(
"https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,bitcoin-cash&vs_currencies=usd"
);


let d=await r.json();


BTC=d.bitcoin.usd;

BCH=d["bitcoin-cash"].usd;



btcPrice.innerHTML=
BTC+" USD";


bchPrice.innerHTML=
BCH+" USD";



}catch(e){}



}


price();

setInterval(price,60000);





amount.oninput=function(){


let v=Number(this.value);

let c=currency.value;


let usd=0;


if(c=="btc")
usd=v*BTC;


if(c=="bch")
usd=v*BCH;



convert.innerHTML=
usd.toFixed(2)+" USD";


}





function copyBTC(){

navigator.clipboard.writeText(
"1Q99GpYnEU9yELNLjiJUWopNT1HatRYQrV"
);

alert("BTC کپی شد");

}




function copyBCH(){

navigator.clipboard.writeText(
"bitcoincash:qrj64uh0xlah2wzksudq3g5eeg2ewdyg6urq5kywku"
);

alert("BCH کپی شد");

}




function send(){

alert("درخواست ارسال ثبت شد");

}


</script>


</body>
  </html>
