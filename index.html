<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallet BTC BCH</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#080808;
color:white;
text-align:center;
}

.box{
max-width:430px;
margin:auto;
padding:20px;
}

.card{
background:#171717;
border-radius:25px;
padding:20px;
margin:15px 0;
}

.logo{
font-size:45px;
}

input{
width:90%;
padding:13px;
margin:7px;
border-radius:12px;
border:none;
font-size:16px;
}

button{
padding:12px 25px;
border:0;
border-radius:15px;
background:#f5b700;
font-size:17px;
cursor:pointer;
}

.coin{
font-size:20px;
margin:15px;
}

.dot{
display:inline-block;
width:12px;
height:12px;
background:#00ff00;
border-radius:50%;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:.2}
}

.hide{
display:none;
}

.theme button{
margin:4px;
}

</style>

</head>


<body>

<div class="box">


<div class="logo">
🟠₿ 🟢
</div>

<h1>Wallet BTC BCH</h1>


<div class="card">

<h3>قیمت زنده ارزها</h3>

<div class="coin">
🟠 Bitcoin
<span class="dot"></span>
<br>
<b id="btc">درحال دریافت...</b>
</div>


<div class="coin">
🟢 Bitcoin Cash
<span class="dot"></span>
<br>
<b id="bch">درحال دریافت...</b>
</div>

</div>



<div class="card" id="loginBox">

<h2>ورود / ثبت نام</h2>

<input id="email" placeholder="ایمیل">

<input id="password" type="password" placeholder="رمز عبور">

<br>

<button onclick="login()">
ورود به کیف
</button>

</div>




<div class="card hide" id="walletBox">

<h2>🔐 کیف شما</h2>

<p id="showEmail"></p>

<hr>

<h3>تنظیمات</h3>

<input id="oldPass" placeholder="رمز قبلی">

<input id="newPass" placeholder="رمز جدید">

<input id="repeatPass" placeholder="تکرار رمز جدید">


<button onclick="changePassword()">
تغییر رمز
</button>


<br><br>

<button onclick="admin()">
پنل مدیریت
</button>


</div>


</div>



<script>


let emailSave=localStorage.getItem("walletEmail");
let passSave=localStorage.getItem("walletPass");



function login(){

let email=document.getElementById("email").value;
let pass=document.getElementById("password").value;


if(email=="" || pass==""){
alert("ایمیل و رمز را وارد کنید");
return;
}


if(!emailSave){

localStorage.setItem("walletEmail",email);
localStorage.setItem("walletPass",pass);

openWallet();

}

else if(email==emailSave && pass==passSave){

openWallet();

}

else{

alert("ایمیل یا رمز اشتباه است");

}

}




function openWallet(){

document.getElementById("loginBox").style.display="none";

document.getElementById("walletBox").classList.remove("hide");


document.getElementById("showEmail").innerHTML=
"ایمیل: "+localStorage.getItem("walletEmail");

}




function changePassword(){

let old=document.getElementById("oldPass").value;

let n1=document.getElementById("newPass").value;

let n2=document.getElementById("repeatPass").value;


if(old==localStorage.getItem("walletPass") && n1==n2 && n1!=""){

localStorage.setItem("walletPass",n1);

alert("رمز تغییر کرد");

}

else{

alert("اطلاعات اشتباه است");

}

}



function admin(){

let p=prompt("رمز مدیر:");

if(p=="Admin321"){

alert("ورود مدیر موفق شد");

}

else{

alert("رمز اشتباه است");

}

}



async function prices(){

try{

let r=await fetch(
"https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,bitcoin-cash&vs_currencies=usd"
);

let d=await r.json();


document.getElementById("btc").innerHTML=
d.bitcoin.usd+" USD";


document.getElementById("bch").innerHTML=
d["bitcoin-cash"].usd+" USD";


}catch(e){}

}


prices();

setInterval(prices,60000);


</script>


</body>
</html>
