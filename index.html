<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallet BTC BCH</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#080808;
color:white;
text-align:center;
}

.box{
max-width:430px;
margin:auto;
padding:20px;
}

.card{
background:#171717;
border-radius:20px;
padding:20px;
margin:15px 0;
}

.logo{
font-size:45px;
}

input{
width:85%;
padding:14px;
margin:8px;
border-radius:12px;
border:0;
font-size:16px;
}

button{
background:#f5b700;
border:0;
padding:13px 30px;
border-radius:15px;
font-size:17px;
}

.coin{
font-size:20px;
margin:15px;
}

.dot{
display:inline-block;
width:12px;
height:12px;
background:#00ff00;
border-radius:50%;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:.2;}
}

#wallet{
display:none;
}

</style>

</head>

<body>


<div class="box">


<div id="login">


<div class="logo">
🟠₿ 🟢
</div>

<h1>Wallet BTC BCH</h1>


<div class="card">

<h3>قیمت زنده</h3>


<div class="coin">
🟠 Bitcoin
<span class="dot"></span>
<br>
<b id="btc">Loading...</b>
</div>


<div class="coin">
🟢 Bitcoin Cash
<span class="dot"></span>
<br>
<b id="bch">Loading...</b>
</div>


</div>



<div class="card">

<h2>ورود به کیف</h2>


<input id="email" placeholder="ایمیل">


<input id="pass" type="password" placeholder="رمز عبور">


<br>


<button onclick="enterWallet()">
ورود
</button>


</div>


</div>



<div id="wallet">


<div class="card">

</div>


</div>


</div>



<script>


function enterWallet(){

let email=document.getElementById("email").value;

let pass=document.getElementById("pass").value;


if(email=="" || pass==""){

alert("ایمیل و رمز را وارد کنید");

return;

}


localStorage.setItem("email",email);


document.getElementById("login").style.display="none";

document.getElementById("wallet").style.display="block";


}



async function price(){

try{

let r=await fetch(
"https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,bitcoin-cash&vs_currencies=usd"
);


let d=await r.json();


document.getElementById("btc").innerHTML=
d.bitcoin.usd+" USD";


document.getElementById("bch").innerHTML=
d["bitcoin-cash"].usd+" USD";


}

catch(e){

document.getElementById("btc").innerHTML="خطا";

document.getElementById("bch").innerHTML="خطا";

}

}


price();

setInterval(price,60000);


</script>
<!-- Crypto Wallet Panel -->

<div class="card">

<h2>💰 Wallet Crypto</h2>


<div class="coin">
🟠 Bitcoin (BTC)
<span class="online"></span>
<br>
<b id="btcPrice">Loading...</b>
</div>


<div class="coin">
🟢 Bitcoin Cash (BCH)
<span class="online"></span>
<br>
<b id="bchPrice">Loading...</b>
</div>


<div class="coin">
⚡ Litecoin (LTC)
<span class="online"></span>
<br>
<b id="ltcPrice">Loading...</b>
</div>



<hr>


<h3>📥 دریافت ارز</h3>


<p>BTC Address</p>
<input id="btcAddr"
value="1Q99GpYnEU9yELNLjiJUWopNT1HatRYQrV"
readonly>

<button onclick="copyText('btcAddr')">
کپی BTC
</button>



<p>BCH Address</p>

<input id="bchAddr"
value="bitcoincash:qrj64uh0xlah2wzksudq3g5eeg2ewdyg6urq5kywku"
readonly>

<button onclick="copyText('bchAddr')">
کپی BCH
</button>



<p>LTC Address</p>

<input id="ltcAddr"
value="آدرس LTC خود را وارد کنید"
readonly>

<button onclick="copyText('ltcAddr')">
کپی LTC
</button>



<hr>


<h3>📤 ارسال ارز</h3>


<select id="coinSelect">
<option value="btc">Bitcoin BTC</option>
<option value="bch">Bitcoin Cash BCH</option>
<option value="ltc">Litecoin LTC</option>
</select>


<br><br>


<input id="amount"
placeholder="مقدار ارز">


<p id="result">
ارزش تقریبی: 0 USD
</p>


</div>



<style>

.online{

display:inline-block;
width:12px;
height:12px;
background:#00ff66;
border-radius:50%;
animation:flash 1s infinite;

}


@keyframes flash{

50%{
opacity:.2;
}

}

</style>



<script>

let BTC=0;
let BCH=0;
let LTC=0;



async function getPrices(){

try{


let r=await fetch(
"https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,bitcoin-cash,litecoin&vs_currencies=usd"
);


let d=await r.json();


BTC=d.bitcoin.usd;
BCH=d["bitcoin-cash"].usd;
LTC=d.litecoin.usd;



btcPrice.innerHTML=BTC+" USD";

bchPrice.innerHTML=BCH+" USD";

ltcPrice.innerHTML=LTC+" USD";



}catch(e){}



}



getPrices();

setInterval(getPrices,60000);





function copyText(id){

navigator.clipboard.writeText(
document.getElementById(id).value
);

alert("آدرس کپی شد");

}





amount.oninput=function(){


let coin=coinSelect.value;

let price=0;


if(coin=="btc"){
price=BTC;
}


if(coin=="bch"){
price=BCH;
}


if(coin=="ltc"){
price=LTC;
}



result.innerHTML=
"ارزش تقریبی: "+
(Number(this.value)*price).toFixed(2)
+" USD";


}



coinSelect.onchange=function(){

amount.dispatchEvent(new Event("input"));

}



</script>
</body>
</html>
