<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BTC BCH Exchange</title>

<style>

body{
margin:0;
font-family:tahoma;
background:linear-gradient(#ffd900,#08a34a);
}

.app{
max-width:460px;
margin:auto;
padding:15px;
text-align:center;
}

.panel{
background:white;
border-radius:25px;
padding:20px;
margin:15px 0;
box-shadow:0 5px 20px #555;
}


.coin{
background:#111;
color:white;
border-radius:20px;
padding:15px;
margin:10px;
}


.logo{
font-size:45px;
}


.blink{
width:12px;
height:12px;
background:#00ff4c;
display:inline-block;
border-radius:50%;
animation:x 1s infinite;
}

@keyframes x{
50%{opacity:.2}
}


input,select{
width:90%;
padding:14px;
margin:8px;
border-radius:15px;
border:1px solid #aaa;
}


button{
background:#079447;
color:white;
border:0;
padding:14px 25px;
border-radius:15px;
}


.address{
background:#eee;
padding:12px;
border-radius:10px;
font-size:12px;
word-break:break-all;
}


.hide{
display:none;
}

</style>

</head>


<body>


<div class="app">


<h1>
🟠₿ 🟢 Wallet Exchange
</h1>



<div class="panel">


<div class="coin">

🟠 Bitcoin
<span class="blink"></span>

<br>

<span id="btcPrice">
درحال قیمت...
</span>

</div>



<div class="coin">

🟢 Bitcoin Cash
<span class="blink"></span>

<br>

<span id="bchPrice">
درحال قیمت...
</span>

</div>


</div>





<div class="panel">


<h2>
موجودی
</h2>


<p>
🟠 BTC :
<b>0.000000000</b>
</p>


<p>
🟢 BCH :
<b>0.000000000</b>
</p>


<h2>
💵 0.00 USD
</h2>


</div>







<div class="panel">


<h2>
معامله
</h2>



<select id="coin">

<option value="btc">
Bitcoin BTC
</option>

<option value="bch">
Bitcoin Cash BCH
</option>


</select>




<select id="action" onchange="changeAction()">

<option value="receive">
دریافت
</option>

<option value="send">
ارسال
</option>

</select>




<div id="receive">


<h3>
آدرس دریافت
</h3>


<div class="address" id="receiveAddress">

انتخاب ارز

</div>


<button onclick="copyAddress()">
کپی آدرس
</button>


</div>







<div id="send" class="hide">


<h3>
مقدار ارسال
</h3>


<input id="amount" placeholder="مقدار ارز">


<p id="usd">
ارزش دلار: 0.00 USD
</p>



<h3>
آدرس مقصد
</h3>


<input placeholder="آدرس کاربر">


<button>
ثبت ارسال
</button>


</div>



</div>



</div>





<script>


let BTC=0;
let BCH=0;



async function price(){


let r=await fetch(

"https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,bitcoin-cash&vs_currencies=usd"

);


let d=await r.json();


BTC=d.bitcoin.usd;

BCH=d["bitcoin-cash"].usd;



btcPrice.innerHTML=
BTC+" USD";


bchPrice.innerHTML=
BCH+" USD";


}


price();

setInterval(price,60000);






function changeAction(){


if(action.value=="send"){

receive.classList.add("hide");

send.classList.remove("hide");


}else{


send.classList.add("hide");

receive.classList.remove("hide");

showAddress();

}


}





coin.onchange=function(){

showAddress();

}





function showAddress(){


if(coin.value=="btc"){

receiveAddress.innerHTML=
"1Q99GpYnEU9yELNLjiJUWopNT1HatRYQrV";

}else{


receiveAddress.innerHTML=
"bitcoincash:qrj64uh0xlah2wzksudq3g5eeg2ewdyg6urq5kywku";

}


}




amount.oninput=function(){


let v=Number(amount.value);


let usd=0;


if(coin.value=="btc")
usd=v*BTC;


if(coin.value=="bch")
usd=v*BCH;



document.getElementById("usd").innerHTML=
"ارزش دلار: "+usd.toFixed(2)+" USD";


}





function copyAddress(){


navigator.clipboard.writeText(
receiveAddress.innerText
);


alert("آدرس کپی شد");


}



showAddress();


</script>


</body>
  </html>
