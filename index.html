<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallet BTC BCH</title>

<style>
body{
margin:0;
font-family:tahoma;
background:#080808;
color:white;
text-align:center;
}

.box{
max-width:430px;
margin:auto;
padding:20px;
}

.card{
background:#171717;
border-radius:20px;
padding:20px;
margin:15px 0;
}

.logo{
font-size:45px;
}

input{
width:85%;
padding:14px;
margin:8px;
border-radius:12px;
border:0;
font-size:16px;
}

button{
background:#f5b700;
border:0;
padding:13px 30px;
border-radius:15px;
font-size:17px;
}

.coin{
font-size:20px;
margin:15px;
}

.dot{
display:inline-block;
width:12px;
height:12px;
background:#00ff00;
border-radius:50%;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:.2;}
}

#wallet{
display:none;
}

</style>

</head>

<body>


<div class="box">


<div id="login">


<div class="logo">
🟠₿ 🟢
</div>

<h1>Wallet BTC BCH</h1>


<div class="card">

<h3>قیمت زنده</h3>


<div class="coin">
🟠 Bitcoin
<span class="dot"></span>
<br>
<b id="btc">Loading...</b>
</div>


<div class="coin">
🟢 Bitcoin Cash
<span class="dot"></span>
<br>
<b id="bch">Loading...</b>
</div>


</div>



<div class="card">

<h2>ورود به کیف</h2>


<input id="email" placeholder="ایمیل">


<input id="pass" type="password" placeholder="رمز عبور">


<br>


<button onclick="enterWallet()">
ورود
</button>


</div>


</div>



<div id="wallet">


<div class="logo">
🔐
</div>

<h1>Wallet BTC BCH</h1>

<div class="card">

<h2>ورود موفق</h2>

<p>
کیف شما آماده است
</p>

</div>


</div>


</div>



<script>


function enterWallet(){

let email=document.getElementById("email").value;

let pass=document.getElementById("pass").value;


if(email=="" || pass==""){

alert("ایمیل و رمز را وارد کنید");

return;

}


localStorage.setItem("email",email);


document.getElementById("login").style.display="none";

document.getElementById("wallet").style.display="block";


}



async function price(){

try{

let r=await fetch(
"https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,bitcoin-cash&vs_currencies=usd"
);


let d=await r.json();


document.getElementById("btc").innerHTML=
d.bitcoin.usd+" USD";


document.getElementById("bch").innerHTML=
d["bitcoin-cash"].usd+" USD";


}

catch(e){

document.getElementById("btc").innerHTML="خطا";

document.getElementById("bch").innerHTML="خطا";

}

}


price();

setInterval(price,60000);


</script>


</body>
</html>
