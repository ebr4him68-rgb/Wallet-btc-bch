<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Wallet</title>

<style>
body{
background:#111;
color:white;
font-family:tahoma;
margin:0;
}

.header{
background:#000;
padding:15px;
text-align:center;
}

.price{
display:flex;
gap:10px;
justify-content:center;
}

.box{
background:#222;
padding:10px;
border-radius:15px;
}

.btc{color:orange}
.bch{color:#00d26a}

.wallet{
padding:20px;
}

.coin{
background:#222;
padding:15px;
border-radius:20px;
margin:15px 0;
cursor:pointer;
}

.coin:hover{
background:#333;
}

button{
padding:12px;
border:0;
border-radius:15px;
margin:5px;
background:#ffb000;
font-weight:bold;
}

.panel{
display:none;
background:#1b1b1b;
padding:20px;
border-radius:20px;
}

input{
width:90%;
padding:12px;
border-radius:10px;
margin:5px;
}

.address{
background:#000;
padding:10px;
word-break:break-all;
border-radius:10px;
}
</style>

</head>

<body>


<div class="header">

<h2>💰 Crypto Wallet</h2>

<div class="price">

<div class="box btc">
BTC<br>
<span id="btcPrice">Loading...</span>
</div>

<div class="box bch">
BCH<br>
<span id="bchPrice">Loading...</span>
</div>

</div>

</div>


<div class="wallet">


<div class="coin" onclick="openCoin('BTC')">

<h3>🟠 Bitcoin BTC</h3>

موجودی:
0.000000 BTC

<br>

ارزش دلار:
$0

</div>



<div class="coin" onclick="openCoin('BCH')">

<h3>🟢 Bitcoin Cash BCH</h3>

موجودی:
0.000000 BCH

<br>

ارزش دلار:
$0

</div>



<div id="panel" class="panel">

<h2 id="name"></h2>


<h3>آدرس دریافت</h3>

<div class="address" id="address"></div>


<br>

<button onclick="copyAddress()">کپی آدرس</button>


<hr>


<h3>ارسال</h3>

<input placeholder="مقدار ارسال">


<input placeholder="آدرس مقصد">


<button>
ارسال تراکنش
</button>


<h3>دریافت</h3>

<input placeholder="مبلغ دریافت">


<button>
ساخت درخواست دریافت
</button>


</div>



</div>



<script>


let currentAddress="";


let coins={

BTC:{
name:"Bitcoin BTC",
address:"1Q99GpYnEU9yELNLjiJUWopNT1HatRYQrV"
},


BCH:{
name:"Bitcoin Cash BCH",
address:"bitcoincash:qrj64uh0xlah2wzksudq3g5eeg2ewdyg6urq5kywku"
}

};



function openCoin(c){

document.getElementById("panel").style.display="block";

document.getElementById("name").innerHTML=coins[c].name;

document.getElementById("address").innerHTML=coins[c].address;

currentAddress=coins[c].address;

}



function copyAddress(){

navigator.clipboard.writeText(currentAddress);

alert("آدرس کپی شد");

}



// قیمت زنده

async function prices(){

try{

let r=await fetch(
"https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,bitcoin-cash&vs_currencies=usd"
);


let d=await r.json();


document.getElementById("btcPrice").innerHTML=
"$"+d.bitcoin.usd;


document.getElementById("bchPrice").innerHTML=
"$"+d["bitcoin-cash"].usd;


}

catch(e){

document.getElementById("btcPrice").innerHTML="Offline";

document.getElementById("bchPrice").innerHTML="Offline";

}

}


prices();

setInterval(prices,60000);


</script>

<script>

// اضافه کردن ارزهای جدید به کیف

coins.DOGE = {
name:"Dogecoin DOGE",
address:"DA9b1AqJqgsdFNuJNjzRo2g5wFj1rEeQLk"
};


coins.LTC = {
name:"Litecoin LTC",
address:"LZeRDFWbPLpuqeAw7m5i5YcYiu32KRAM6c"
};


// اضافه کردن نمایش به لیست کیف

document.querySelector(".wallet").insertAdjacentHTML(
"beforeend",

`
<div class="coin" onclick="openCoin('DOGE')">

<h3>🐕 Dogecoin DOGE</h3>

موجودی:
0.000000 DOGE

<br>

ارزش دلار:
$0

</div>


<div class="coin" onclick="openCoin('LTC')">

<h3>⚡ Litecoin LTC</h3>

موجودی:
0.000000 LTC

<br>

ارزش دلار:
$0

</div>
`
);

</script>
  <style>

.settings-btn{
position:fixed;
top:10px;
left:10px;
background:#222;
color:white;
padding:12px;
border-radius:50%;
cursor:pointer;
z-index:999;
font-size:22px;
}

.settings-box{
display:none;
position:fixed;
top:60px;
left:10px;
width:280px;
background:#222;
padding:15px;
border-radius:20px;
z-index:999;
}

.settings-box input{
width:90%;
padding:10px;
margin:5px;
border-radius:10px;
}

.settings-box button{
width:95%;
padding:10px;
margin:5px;
border-radius:10px;
background:#ffb000;
border:0;
}

</style>


<div class="settings-btn" onclick="openSettings()">
⚙️
</div>


<div class="settings-box" id="settings">

<h3>تنظیمات کیف</h3>


<button onclick="changePass()">
🔐 تغییر رمز
</button>


<button onclick="registerUser()">
👤 ثبت نام
</button>


<button onclick="adminLogin()">
🛡 ادمین
</button>


<button onclick="logout()">
🚪 خروج
</button>


<div id="adminPanel"></div>


</div>



<script>


function openSettings(){

let s=document.getElementById("settings");

s.style.display=
s.style.display=="block"?
"none":"block";

}



// تغییر رمز

function changePass(){

let oldPass=prompt("رمز قبلی:");

let saved=localStorage.getItem("walletPass");


if(saved && oldPass!=saved){

alert("رمز قبلی اشتباه است");
return;

}


let n1=prompt("رمز جدید:");

let n2=prompt("تکرار رمز جدید:");

if(n1==n2){

localStorage.setItem("walletPass",n1);

alert("رمز تغییر کرد");

}else{

alert("رمزها برابر نیستند");

}

}




// ثبت نام

function registerUser(){

let user=prompt("نام کاربری:");

if(user){

localStorage.setItem("walletUser",user);

alert("ثبت نام شد: "+user);

}

}



// ادمین

function adminLogin(){

let pass=prompt("رمز ادمین:");

if(pass=="Admin321"){


let users=localStorage.getItem("walletUser") || "کاربری ثبت نشده";


document.getElementById("adminPanel").innerHTML=

`
<hr>

<h4>پنل ادمین</h4>

کاربر:<br>
${users}

<br><br>

تراکنش ها:

<br>

هنوز تراکنشی ثبت نشده

`;



}else{

alert("رمز اشتباه");

}

}



// خروج

function logout(){

localStorage.removeItem("walletUser");

alert("خارج شدید");

}


</script>
</body>
</html>
